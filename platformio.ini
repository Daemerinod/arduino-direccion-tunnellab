; Nodo sensorial de dirección — Arduino Mega 2560 (ATmega2560)
; MVP de laboratorio: sensores y UDP simulados. Sin Wire.h y sin Ethernet.h.
; El buffer serie amplio permite volcar la trama a 10 Hz sin llenar el TX de 64 bytes.

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++11
    -DSERIAL_TX_BUFFER_SIZE=256
build_src_flags =
    -Wall
    -Wextra
